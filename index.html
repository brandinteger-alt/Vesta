<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vesta — Brand Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#b8955a;--gold-light:#d4b07a;--gold-dark:#8a6c3e;
  --dark:#1c1812;--mid:#4a3f2f;--muted:#8a7a62;
  --border:#e8dcc8;--bg:#faf7f2;--card:#ffffff;
  --red:#c0392b;--green:#16a34a;--blue:#2563eb;
  --shadow:0 2px 16px rgba(28,24,18,0.07);
}
html,body{min-height:100%;background:var(--bg);font-family:'Jost',sans-serif;color:var(--dark);}

/* ── LOGIN ── */
#loginScreen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1c1812 0%,#2e2416 60%,#1a160f 100%);
  padding:24px;position:relative;overflow:hidden;
}
#loginScreen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(184,149,90,0.08) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(184,149,90,0.05) 0%,transparent 50%);
  pointer-events:none;
}
.login-brand{text-align:center;margin-bottom:36px;}
.login-brand h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;color:#fff;letter-spacing:0.5px;}
.login-brand p{font-size:0.68rem;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-top:5px;}
.login-card{width:100%;max-width:360px;background:rgba(255,255,255,0.04);border:1px solid rgba(184,149,90,0.2);border-radius:22px;padding:32px 28px;backdrop-filter:blur(12px);box-shadow:0 32px 80px rgba(0,0,0,0.5);}
.login-card h2{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#fff;font-weight:500;margin-bottom:5px;}
.login-card p{font-size:0.72rem;color:rgba(255,255,255,0.35);margin-bottom:26px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:0.63rem;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:7px;}
.login-field input{width:100%;padding:12px 16px;border-radius:11px;border:1.5px solid rgba(184,149,90,0.2);background:rgba(255,255,255,0.05);color:#fff;font-family:'Jost',sans-serif;font-size:0.87rem;outline:none;transition:border-color .2s;}
.login-field input::placeholder{color:rgba(255,255,255,0.18);}
.login-field input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:14px;border-radius:13px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;font-family:'Jost',sans-serif;font-size:0.87rem;font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:all .2s;margin-top:8px;box-shadow:0 6px 24px rgba(184,149,90,0.3);}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(184,149,90,0.4);}
.login-error{background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);color:#ff8a7a;border-radius:9px;padding:10px 14px;font-size:0.73rem;margin-top:12px;display:none;text-align:center;}

/* ── DASHBOARD ── */
#dashboard{display:none;min-height:100vh;}
.header{background:linear-gradient(135deg,#1c1812,#2a1e10);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(184,149,90,0.2);position:sticky;top:0;z-index:200;}
.header-info{flex:1;}
.header-info h1{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:#fff;font-weight:600;}
.header-info p{font-size:0.58rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);}
.logout-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);border-radius:8px;padding:6px 10px;font-size:0.63rem;cursor:pointer;font-family:'Jost',sans-serif;transition:all .2s;flex-shrink:0;}
.logout-btn:hover{color:#fff;background:rgba(255,255,255,0.1);}

/* ── NAV TABS ── */
.nav-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:67px;z-index:190;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{flex:1;min-width:72px;padding:12px 8px;text-align:center;font-size:0.65rem;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;white-space:nowrap;}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.nav-tab:hover{color:var(--dark);}

/* ── CONTENT PANELS ── */
.panel{display:none;padding:20px 16px;max-width:640px;margin:0 auto;animation:fadeUp .3s ease;}
.panel.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── LOADING ── */
.loading-state{text-align:center;padding:60px 20px;}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-state p{font-size:0.78rem;color:var(--muted);}

/* ── SECTION TITLES ── */
.section-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--dark);margin:20px 0 12px;}
.section-title span{font-style:italic;color:var(--gold);}

/* ── SUMMARY STRIP ── */
.summary-strip{display:flex;background:linear-gradient(135deg,#1c1812,#2e2416);border-radius:16px;padding:16px 8px;margin-bottom:20px;border:1px solid rgba(184,149,90,0.2);box-shadow:0 4px 24px rgba(0,0,0,0.12);}
.strip-item{flex:1;text-align:center;padding:0 8px;border-right:1px solid rgba(184,149,90,0.15);}
.strip-item:last-child{border-right:none;}
.strip-val{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:var(--gold-light);}
.strip-lbl{font-size:0.56rem;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-top:3px;}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
.kpi-card.full{grid-column:1/-1;}
.kpi-name{font-size:0.6rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.kpi-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:var(--dark);line-height:1;}
.kpi-sub{font-size:0.63rem;color:var(--muted);margin-top:5px;}

/* ── BUTTONS ── */
.btn-group{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;}
.btn-group button{padding:8px 2px;border-radius:10px;border:1px solid var(--border);background:#fff;font-family:'Jost',sans-serif;font-size:0.65rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;}
.btn-group button:hover{background:var(--gold);color:#fff;}

.week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px;}
.week-btn{padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-family:'Jost',sans-serif;font-size:0.75rem;font-weight:600;cursor:pointer;transition:all .2s;position:relative;}
.week-btn.active{border-color:var(--gold);background:var(--gold);color:#fff;}
.week-btn.active::after{content:'✓';position:absolute;top:3px;right:4px;width:5px;height:5px;background:#fff;border-radius:50%;opacity:0.8;}

/* ── DRILL-DOWN ── */
.drill-details{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px;}
details{border-bottom:1px solid var(--border);}
summary{padding:14px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;list-style:none;}
summary:hover{background:#faf7f2;}
.drill-content{padding:0 16px 14px;}
.drill-card{background:#faf7f2;border-radius:10px;padding:10px 12px;margin-top:8px;}
.drill-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.drill-badge{background:linear-gradient(135deg,#1c1812,#2e2416);color:var(--gold-light);border-radius:6px;padding:2px 8px;font-size:0.65rem;font-weight:700;}
.drill-bar{height:4px;background:#e8dcc8;border-radius:99px;margin-bottom:6px;overflow:hidden;}
.drill-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:99px;}
.drill-stats{display:flex;justify-content:space-between;font-size:0.65rem;color:var(--muted);}

.error-banner{background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.2);color:#c0392b;border-radius:10px;padding:14px;font-size:0.73rem;margin-bottom:16px;}
.error-banner button{margin-top:8px;padding:8px 18px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;}

@media (max-width:640px){
  .kpi-grid{grid-template-columns:1fr;}
  .btn-group{grid-template-columns:repeat(3,1fr);}
  .week-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-brand">
    <h1>Vesta</h1>
    <p>Brand Portal</p>
  </div>
  <div class="login-card">
    <h2>Welcome Back</h2>
    <p>Enter your credentials to access the portal</p>
    <form onsubmit="handleLogin(event)">
      <div class="login-field">
        <label>Brand Name</label>
        <input type="text" id="brandInput" placeholder="Vesta" autocomplete="off">
      </div>
      <div class="login-field">
        <label>Access Code</label>
        <input type="password" id="codeInput" placeholder="••••••" autocomplete="off">
      </div>
      <button type="submit" class="login-btn">Access Portal</button>
      <div class="login-error" id="loginError">Invalid credentials</div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="header">
    <div class="header-info">
      <h1>Vesta</h1>
      <p>Campaign Portal</p>
    </div>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('dashContent')">Dashboard</button>
    <button class="nav-tab" onclick="switchTab('payContent')">Payments</button>
    <button class="nav-tab" onclick="switchTab('impactContent')">Impact</button>
    <button class="nav-tab" onclick="switchTab('ratContent')">Ratings</button>
  </div>

  <div class="panel active" id="dashPanel">
    <div id="loadingState" class="loading-state" style="display:none;">
      <div class="spinner"></div>
      <p>Loading campaign data...</p>
    </div>
    <div id="dashContent"></div>
  </div>

  <div class="panel" id="payPanel">
    <div id="payContent"></div>
  </div>

  <div class="panel" id="impactPanel">
    <div id="impactContent"></div>
  </div>

  <div class="panel" id="ratPanel">
    <div id="ratContent"></div>
  </div>
</div>

<script>
const SHEET_ID = '1wvFizOzI8kpBZhdbJAPAOsaS9QSJqg02TiGH4PFKicU';
const VALID_BRAND = 'Vesta';
const VALID_CODE = 'B049';

let poaData = [];
let orderData = [];
let selWeeks = new Set([0,1,2,3]); // All weeks selected by default

const weekNames = ['Week 1 (May 26-31)', 'Week 2 (Jun 1-7)', 'Week 3 (Jun 8-14)', 'Week 4 (Jun 15-21)'];
const monthNames = ['May', 'June'];
const weekToMonth = [0, 1, 1, 1]; // Week 0 = May, Weeks 1-3 = June

// LOGIN
function handleLogin(e) {
  e.preventDefault();
  const brand = document.getElementById('brandInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();
  
  if (brand === VALID_BRAND && code === VALID_CODE) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function handleLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('brandInput').value = '';
  document.getElementById('codeInput').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// TAB SWITCHING
function switchTab(panelId) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  
  const panelMap = {
    'dashContent': 'dashPanel',
    'payContent': 'payPanel',
    'impactContent': 'impactPanel',
    'ratContent': 'ratPanel'
  };
  
  document.getElementById(panelMap[panelId]).classList.add('active');
}

// DATA LOADING
async function fetchSheet(sheetId, tabName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  const text = await res.text();
  const m = text.match(/setResponse\(([\s\S]*)\)/);
  if (!m) throw new Error("Parse failed");
  const json = JSON.parse(m[1]);
  const cols = json.table.cols.map(c => (c.label || '').trim());
  const rows = (json.table.rows || []).map(r =>
    (r.c || []).map((cell, ci) => {
      if (!cell || cell.v == null) return '';
      return String(cell.f !== undefined && cell.f !== null ? cell.f : cell.v).trim();
    })
  ).filter(r => r.some(c => c !== ''));
  return { cols, rows };
}

async function loadData() {
  document.getElementById('loadingState').style.display = 'block';
  const hardTimeout = setTimeout(() => {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('dashContent').innerHTML = `<div class="error-banner">⚠️ Timed out.<br><button onclick="loadData()">↺ Retry</button></div>`;
  }, 15000);

  try {
    const poa = await fetchSheet(SHEET_ID, 'POA');
    const orders = await fetchSheet(SHEET_ID, 'Order Details');
    
    poaData = poa.rows.map(r => ({
      product: r[0] || '',
      link: r[1] || '',
      current: parseInt(r[2]) || 0,
      noOfReviews: parseInt(r[3]) || 0,
      target: parseInt(r[4]) || 0,
      total: parseInt(r[5]) || 0,
      fiveStarReviews: parseInt(r[6]) || 0,
      fourStarReviews: parseInt(r[7]) || 0,
      fiveStarRating: parseFloat(r[8]) || 0,
      week1: parseInt(r[9]) || 0,
      week2: parseInt(r[10]) || 0,
      week3: parseInt(r[11]) || 0,
      week4: parseInt(r[12]) || 0
    }));

    orderData = orders.rows;
    
    clearTimeout(hardTimeout);
    document.getElementById('loadingState').style.display = 'none';
    renderDashboard();
    renderPayments();
    renderImpact();
    renderRatings();
  } catch (e) {
    clearTimeout(hardTimeout);
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('dashContent').innerHTML = `<div class="error-banner">⚠️ Error: ${e.message}<br><button onclick="loadData()">↺ Retry</button></div>`;
  }
}

// DASHBOARD WITH MONTH/WEEK SELECTION
function renderDashboard() {
  let html = `
    <p class="section-title" style="margin-top:4px;">Monthly <span>Summary</span></p>
    <p style="font-size:0.7rem;color:var(--muted);margin-bottom:14px;">Select weeks · then drill into details</p>

    <div class="kpi-name" style="margin-bottom:8px;">QUICK SELECT</div>
    <div class="btn-group">
      <button onclick="selectQuick([0])">Week 1</button>
      <button onclick="selectQuick([1,2,3])">Weeks 2-4</button>
      <button onclick="selectQuick([0,1,2,3])">All Weeks</button>
      <button onclick="selectQuick([])">Clear</button>
      <button onclick="selectQuick([1,2])">Mid-June</button>
    </div>

    <div class="kpi-name" style="margin-bottom:8px;">SELECT WEEKS <span style="color:var(--gold);font-size:0.58rem;">(TAP TO TOGGLE)</span></div>
    <div class="week-grid" id="weekGrid">
  `;

  weekNames.forEach((w, i) => {
    html += `
      <button id="wbtn-${i}" class="week-btn ${selWeeks.has(i) ? 'active' : ''}" onclick="toggleWeek(${i})">
        ${w}
      </button>
    `;
  });

  html += `</div><div id="dashKpis"></div><div id="dateDrill"></div>`;

  document.getElementById('dashContent').innerHTML = html;
  updateDashKpis();
}

function selectQuick(weeks) {
  selWeeks = new Set(weeks);
  renderDashboard();
}

function toggleWeek(i) {
  if (selWeeks.has(i)) selWeeks.delete(i); else selWeeks.add(i);
  renderDashboard();
}

function updateDashKpis() {
  const filtered = poaData.filter(p => {
    return Array.from(selWeeks).some(w => {
      const weeks = [p.week1, p.week2, p.week3, p.week4];
      return weeks[w] > 0;
    });
  });

  const totalSlots = filtered.reduce((s,p) => s + (p.week1 + p.week2 + p.week3 + p.week4), 0);
  const slotsDone = orderData.filter(o => {
    const prod = (o[4] || '').trim();
    return filtered.some(p => p.product.toLowerCase() === prod.toLowerCase());
  }).length;
  
  const investment = orderData.filter(o => {
    const prod = (o[4] || '').trim();
    return filtered.some(p => p.product.toLowerCase() === prod.toLowerCase());
  }).reduce((s, r) => s + (parseFloat((r[6] || '').replace(/[^0-9.-]/g, '')) || 0), 0);

  const campaigns = [...new Set(filtered.map(p => p.product))].length;
  const pct = totalSlots > 0 ? Math.round(slotsDone / totalSlots * 100) : 0;

  const selLabel = selWeeks.size === 0 ? 'No week selected' :
    selWeeks.size === 4 ? 'All Weeks' :
    [...selWeeks].sort().map(i => weekNames[i].split('(')[0].trim()).join(', ');

  const kpisEl = document.getElementById('dashKpis');
  if (!kpisEl) return;

  kpisEl.innerHTML = `
    <div class="kpi-grid" style="margin-bottom:20px;">
      <div class="kpi-card" style="border-top:3px solid #4ade80;">
        <div class="kpi-name">SLOTS GIVEN</div>
        <div class="kpi-val">${totalSlots || '—'}</div>
        <div class="kpi-sub">${selLabel}</div>
      </div>
      <div class="kpi-card" style="border-top:3px solid #818cf8;">
        <div class="kpi-name">SLOTS DONE</div>
        <div class="kpi-val">${slotsDone || '—'}</div>
        <div class="kpi-sub">${pct}% complete</div>
      </div>
      <div class="kpi-card" style="border-top:3px solid #f87171;">
        <div class="kpi-name">INVESTMENT</div>
        <div class="kpi-val" style="color:var(--gold);">${investment ? '₹' + formatAmt(investment) : '—'}</div>
        <div class="kpi-sub">Total order value</div>
      </div>
      <div class="kpi-card" style="border-top:3px solid #fbbf24;">
        <div class="kpi-name">CAMPAIGNS</div>
        <div class="kpi-val">${campaigns || '—'}</div>
        <div class="kpi-sub">In period</div>
      </div>
    </div>
    ${renderWeekDrill(filtered)}
  `;
}

function formatAmt(n) {
  if (n >= 100000) return (n / 100000).toFixed(2) + 'L';
  return n.toLocaleString('en-IN');
}

function renderWeekDrill(filtered) {
  const byWeek = {};
  filtered.forEach(p => {
    const weeks = [p.week1, p.week2, p.week3, p.week4];
    weeks.forEach((w, i) => {
      if (w > 0 && selWeeks.has(i)) {
        if (!byWeek[i]) byWeek[i] = [];
        byWeek[i].push(p);
      }
    });
  });

  const weeks = Object.keys(byWeek).sort((a,b) => a - b);
  if (!weeks.length) return `<div style="font-size:0.72rem;color:var(--muted);text-align:center;padding:20px;">No slots in selected weeks</div>`;

  return `
    <div class="kpi-name" style="margin-bottom:10px;">DRILL INTO WEEKS (OPTIONAL)</div>
    <div class="drill-details">
      ${weeks.map(w => {
        const prods = byWeek[w];
        const totalSlots = prods.reduce((s, p) => {
          const weeks = [p.week1, p.week2, p.week3, p.week4];
          return s + weeks[w];
        }, 0);
        
        const relatedOrders = orderData.filter(o => {
          const prod = (o[4] || '').trim();
          return prods.some(p => p.product.toLowerCase() === prod.toLowerCase());
        });
        const slots = relatedOrders.length;
        const inv = relatedOrders.reduce((s, r) => s + (parseFloat((r[6] || '').replace(/[^0-9.-]/g, '')) || 0), 0);
        const camps = [...new Set(prods.map(p => p.product))].length;

        return `<details>
          <summary>
            <div>
              <div style="font-weight:600;font-size:0.82rem;">${weekNames[w]}</div>
              <div style="font-size:0.62rem;color:var(--muted);margin-top:2px;">${camps} product(s) · ${totalSlots} slots given · ${slots} matched</div>
            </div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:700;color:var(--gold);">₹${formatAmt(inv)}</div>
          </summary>
          <div class="drill-content">
            ${prods.map(p => {
              const weeks = [p.week1, p.week2, p.week3, p.week4];
              const slotCount = weeks[w];
              const prodOrders = orderData.filter(o => (o[4] || '').trim().toLowerCase() === p.product.toLowerCase());
              const pct = slotCount > 0 ? Math.round(prodOrders.length / slotCount * 100) : 0;
              const prodInv = prodOrders.reduce((s, r) => s + (parseFloat((r[6] || '').replace(/[^0-9.-]/g, '')) || 0), 0);

              return `<div class="drill-card">
                <div class="drill-header">
                  <span class="drill-badge">${p.product.substring(0, 8)}</span>
                  <span style="font-size:0.62rem;color:var(--muted);">${pct}% matched</span>
                </div>
                <div style="font-size:0.78rem;font-weight:500;margin-bottom:6px;">${p.product}</div>
                <div class="drill-bar">
                  <div class="drill-fill" style="width:${pct}%"></div>
                </div>
                <div class="drill-stats">
                  <span>${prodOrders.length}/${slotCount} matched</span>
                  <span style="color:var(--gold-dark);font-weight:600;">₹${formatAmt(prodInv)}</span>
                </div>
              </div>`;
            }).join('')}
          </div>
        </details>`;
      }).join('')}
    </div>
  `;
}
